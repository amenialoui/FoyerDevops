# Server configuration
server.port=8089
server.servlet.context-path=/tpfoyer

# Spring Datasource configuration for MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# HikariCP settings for connection pooling (optional, but recommended)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=600000

# Spring profiles (optional, set to "dev" or "prod" based on the environment)
# spring.profiles.active=dev

# Spring Logging
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=ERROR
logging.level.com=DEBUG

# Enable Swagger/OpenAPI (Springdoc)
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

